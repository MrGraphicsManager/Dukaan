name: Dukaan subscription maintenance

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Run subscription maintenance
        env:
          CRON_SECRET: ${{ secrets.SUBSCRIPTION_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl -fsS -X POST https://dukaan-5me9.onrender.com/api/internal/subscription-maintenance \
            -H "X-Cron-Secret: $CRON_SECRET"
